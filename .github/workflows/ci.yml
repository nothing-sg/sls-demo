name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
      - working-directory: backend
        run: uv sync --group dev
      - working-directory: backend
        run: uv run ruff check src tests
      - working-directory: backend
        run: uv run mypy src
      - working-directory: backend
        run: uv run pytest --cov=src --cov-report=term-missing
      - name: Generate OpenAPI schema
        working-directory: backend
        run: uv run python -c "import json,sys; sys.path.insert(0,'src'); from app import app; json.dump(app.openapi(), open('openapi.json','w'), indent=2)"
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm audit --audit-level=critical
      - name: Check generated API types aren't stale
        uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: backend
      - working-directory: frontend
        # ADR-0003 commits to the frontend's API types being generated from
        # the backend's OpenAPI schema — this fails the build the moment
        # someone changes a backend endpoint/schema without regenerating
        # frontend/src/api/schema.d.ts (`make gen-api`).
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Lint SAM/CloudFormation templates
        working-directory: infra
        run: cfn-lint template.yaml modules/*.yaml
