AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  API layer: one Lambda running the whole FastAPI app (ADR-0001), API Gateway
  in front with a Cognito authorizer.

Parameters:
  Stage:
    Type: String
  VpcId:
    Type: String
  PrivateSubnetIds:
    Type: CommaDelimitedList
  LambdaSecurityGroupId:
    Type: String
  DatabaseSecretArn:
    Type: String
  DatabaseClusterEndpoint:
    Type: String
  AuditLogGroupArn:
    Type: String

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub sls-best-practice-${Stage}
      MfaConfiguration: "ON" # required posture for a HIPAA-scoped app
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReadDatabaseSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # This template is deployed as a nested stack (see ../template.yaml), and
      # SAM's Globals section does not cross into nested-stack templates — so
      # Runtime/Timeout/MemorySize/Tracing must be set explicitly here rather
      # than relying on the root template's Globals: Function block.
      Runtime: python3.12
      Timeout: 29
      MemorySize: 512
      Tracing: Active
      Handler: app.handler
      CodeUri: ../../backend/src
      Role: !GetAtt ApiFunctionRole.Arn
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      Environment:
        Variables:
          APP_STAGE: !Ref Stage
          APP_DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          APP_DATABASE_HOST: !Ref DatabaseClusterEndpoint
          APP_COGNITO_USER_POOL_ID: !Ref UserPool
          APP_COGNITO_APP_CLIENT_ID: !Ref UserPoolClient
      Events:
        # Catch-all for the app's real routes (patients, appointments, health)
        # — protected by the HttpApi's DefaultAuthorizer (Cognito). An
        # explicitly-declared HttpApi (below) does NOT get an automatic
        # catch-all route the way SAM's fully-implicit API shorthand does,
        # so Path/Method must be given explicitly here.
        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        # API documentation is intentionally public: it exposes only endpoint
        # shapes (no PHI), and is the interface spec HITRUST assessors expect
        # for an in-scope system (ADR-0003) — gating it behind Cognito would
        # just block the people who need to read it.
        DocsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /docs
            Method: GET
            Auth:
              Authorizer: NONE
        RedocRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /redoc
            Method: GET
            Auth:
              Authorizer: NONE
        OpenApiSchemaRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /openapi.json
            Method: GET
            Auth:
              Authorizer: NONE

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoAuthorizer
      AccessLogSettings:
        DestinationArn: !Ref AuditLogGroupArn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status"}

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
